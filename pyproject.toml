[project]
name = "agex"
version = "0.13.0.dev0"
description = "Agents that work in a versioned world: a loop over nontainer, for functional tasks and long-running sessions alike."
readme = "README.md"
license = "MIT"
authors = [
    {name = "ashenfad"},
]
keywords = ["agents", "ai", "llm", "python", "sandbox", "workspace"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = [
    # The world: workspaces, turns, the conversation plane, the tools.
    "nontainer>=0.9.1",
    # The provider transport (pydantic_ai.direct); stable within 2.x.
    "pydantic-ai-slim>=2.54,<3",
]

[project.optional-dependencies]
anthropic = ["pydantic-ai-slim[anthropic]>=2.54,<3"]
openai = ["pydantic-ai-slim[openai]>=2.54,<3"]
openrouter = ["pydantic-ai-slim[openrouter]>=2.54,<3"]
google = ["pydantic-ai-slim[google]>=2.54,<3"]
all = ["agex[anthropic,openai,openrouter,google]"]

[project.urls]
Homepage = "https://github.com/ashenfad/agex"
Repository = "https://github.com/ashenfad/agex"
Issues = "https://github.com/ashenfad/agex/issues"

[dependency-groups]
dev = [
    "jsonschema",
    "pre-commit",
    "pyright",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agex"]

[tool.ruff]
line-length = 88
# The docs' code blocks are sketches, aligned by hand.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E731"]

[tool.pyright]
include = ["agex"]
pythonVersion = "3.10"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
