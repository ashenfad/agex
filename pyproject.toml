[project]
name = "agex"
version = "0.13.0.dev0"
description = "Agents that work in a versioned world: a loop over nontainer, for functional tasks and long-running sessions alike."
readme = "README.md"
license = "MIT"
authors = [
    {name = "ashenfad"},
]
keywords = ["agents", "ai", "llm", "python", "sandbox", "workspace"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = [
    # The world: workspaces, turns, the conversation plane, the tools.
    # 0.10.0: async delegate runners and auntil_settled, which
    # delegation runs on.
    "nontainer>=0.10.0",
    # The provider transport (pydantic_ai.direct); stable within 2.x.
    "pydantic-ai-slim>=2.54,<3",
    # Budgeted previews of a task's inputs, in the brief its model reads,
    # with tables and arrays as one-line typed summaries.
    "reprobate>=0.1.4",
]

[project.optional-dependencies]
anthropic = ["pydantic-ai-slim[anthropic]>=2.54,<3"]
openai = ["pydantic-ai-slim[openai]>=2.54,<3"]
openrouter = ["pydantic-ai-slim[openrouter]>=2.54,<3"]
google = ["pydantic-ai-slim[google]>=2.54,<3"]
all = ["agex[anthropic,openai,openrouter,google]"]

[project.urls]
Homepage = "https://github.com/ashenfad/agex"
Repository = "https://github.com/ashenfad/agex"
Issues = "https://github.com/ashenfad/agex/issues"

[dependency-groups]
dev = [
    "jsonschema",
    # Tasks on a dud machine (its subprocess backend, Python 3.11+).
    "nontainer[dud]",
    # Tables and arrays as task values (pulls in numpy); tables cross as Arrow.
    "pandas>=2",
    "pyarrow",
    "pre-commit",
    "pyright",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.uv.sources]
# During the rebuild agex tracks nontainer's main, which gains what agex
# needs before it is released. At the shape freeze, nontainer releases
# and this goes, leaving the floor above.
nontainer = { git = "https://github.com/ashenfad/nontainer", branch = "main" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agex"]

[tool.ruff]
line-length = 88
# The docs' code blocks are sketches, aligned by hand.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E731"]

[tool.pyright]
include = ["agex"]
pythonVersion = "3.10"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Live tests call a real model; run them with `-m live` (see tests/test_live.py).
addopts = "-m 'not live'"
markers = ["live: calls a real model over the network (opt in with -m live)"]
