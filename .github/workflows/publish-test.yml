name: Publish to TestPyPI

on:
  # Manual trigger for testing
  workflow_dispatch:
  # Or trigger on pre-releases
  release:
    types: [prereleased]

jobs:
  build-and-test-publish:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: python -m build

    - name: Check package
      run: twine check dist/*

    - name: Publish to TestPyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
      run: twine upload --repository testpypi dist/*

    - name: Test installation from TestPyPI
      run: |
        # Wait a moment for TestPyPI to process
        sleep 30

        # The version just built: pip skips pre-release and dev versions
        # unless asked, and a bare `agex` would install the latest full
        # release from PyPI instead of this build.
        VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')

        # Install from TestPyPI with main PyPI as fallback for dependencies
        pip install --pre --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ "agex==$VERSION"

        # The installed package is this build, and it imports
        python -c "import agex, importlib.metadata as m; v = m.version('agex'); assert v == '$VERSION', v; print('agex', v, 'imported from TestPyPI')"
