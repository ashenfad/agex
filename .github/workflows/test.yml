name: Tests

on:
  push:
    branches: [ main, rebuild ]
  pull_request:
    branches: [ main, rebuild ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v6
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true
        cache-dependency-glob: pyproject.toml
    - name: Install
      # the provider SDKs too, for the tests against a local endpoint
      run: uv sync --all-extras
    - name: Run tests
      run: uv run --all-extras pytest -v

  checks:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v6
      with:
        python-version: "3.12"
        enable-cache: true
        cache-dependency-glob: pyproject.toml
    - name: Install
      run: uv sync
    - name: Lint
      run: uv run ruff check .
    - name: Format
      run: uv run ruff format --check .
    - name: Types
      run: uv run pyright
